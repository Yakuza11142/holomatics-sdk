[target.x86_64-unknown-linux-gnu]
linker = "cc"

[target.wasm32-unknown-unknown]
linker = "lld"

[target.aarch64-linux-android]
linker = "aarch64-linux-android-clang"

[unstable]
build-std = ["core", "alloc"]

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"
lto = true

[profile.dev]
panic = "abort"
