plugins {
    id 'com.android.library'
}

android {
    // 1. FIXED PACKAGE MATCHING: Aligns namespace exactly with the C++ JNI bindings
    namespace 'com.tesseract.ui'
    compileSdk 34

    defaultConfig {
        // 2. KERNEL REQUIREMENT: Set to API 29 because the engine uses Linux 'memfd_create'
        minSdk 29
        targetSdk 34

        ndk {
            // 3. UNIVERSAL ARCHITECTURES: Builds binaries for modern 64-bit phones, 
            // legacy 32-bit chips, and all variants of desktop testing emulators.
            abiFilters 'arm64-v8a', 'x86_64', 'armeabi-v7a', 'x86'
        }

        externalNativeBuild {
            cmake {
                // 4. NATIVE COMPILER TUNING: Applies aggressive -O3 loop unrolling 
                // and -flto (Link-Time Optimization) across both C math modules and C++ pipelines.
                cFlags "-O3 -flto"
                cppFlags "-std=c++17 -O3 -flto"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            // 5. MAX OVERHAUL: Enables total Java minification and dead-code stripping
            minifyEnabled true
            
            // Compresses and automatically purges unused library assets
            shrinkResources true
            
            // References your aggressive obfuscation rule file
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    // All heavy, unnecessary local tools have been stripped.
    // Add runtime support packages here only as needed.
}
