plugins {
    id 'com.android.library'
}

android {
    // 1. FIXED: Changed namespace to match the C++ JNI function bindings
    namespace 'com.tesseract.ui'
    compileSdk 34

    defaultConfig {
        // 2. FIXED: Raised minSdk to 29 because the library requires 'memfd_create' 
        minSdk 29
        targetSdk 34

        ndk {
            // 3. FIXED: Added 'x86' to cover all possible PC emulator configurations
            abiFilters 'arm64-v8a', 'x86_64', 'armeabi-v7a', 'x86'
        }

        externalNativeBuild {
            cmake {
                // Enabled both highly optimized C and C++ compiler parameters
                cFlags "-O3 -flto"
                cppFlags "-std=c++17 -O3 -flto"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    implementation "com.android.tools.lint:lint-gradle:31.2.2"
    implementation "com.android.tools.build:aapt2:8.2.2-10154469:linux"
}
