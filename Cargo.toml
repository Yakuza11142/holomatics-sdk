[package]
name = "tesseract_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "tesseract_rust"
crate-type = ["staticlib", "rlib"]

[dependencies]
# Standard dependencies can be added here if needed

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
