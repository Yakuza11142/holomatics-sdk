[package]
name = "tesseract_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "tesseract_rust"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
# Zero-allocation dependencies can be added here

[profile.dev]
opt-level = 0
panic = "abort"

[profile.test]
# MUST use unwind for standard cargo test harness
panic = "unwind"
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(loom)'] }
