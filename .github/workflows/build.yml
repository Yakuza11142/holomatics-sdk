name: Build Holomatics SDK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install SWIG & LLVM Strip Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y swig llvm

      - name: Generate Multi-Language Bindings
        run: |
          echo "Generating bindings..."
          # Insert custom SWIG generation commands here if needed

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build & Obfuscate Android SDK (.aar)
        run: ./gradlew :library:assembleRelease -PminifyEnabled=true --configuration-cache --warning-mode all

      - name: Strip Native Binary Symbols
        run: |
          echo "Stripping symbols..."
          # llvm-strip --strip-unneeded path/to/so/files/*.so

      - name: Upload Language Bindings (C#, Python, Java)
        uses: actions/upload-artifact@v4
        with:
          name: language-bindings
          path: |
            bindings/

      - name: Upload Obfuscated Android SDK (.aar)
        uses: actions/upload-artifact@v4
        with:
          name: holomatics-sdk-aar
          path: library/build/outputs/aar/*.aar
