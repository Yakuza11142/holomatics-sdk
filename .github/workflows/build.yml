name: Tesseract Engine CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Compile & Package Tesseract Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang

      - name: Validate Root .tess Architecture
        run: |
          echo "Checking required root module files..."
          files=(
            "core.tess" "layout.tess" "state.tess"
            "text.tess" "input.tess" "physics.tess" "assets.tess"
            "audio.tess" "particles.tess" "network.tess"
            "animation.tess" "camera.tess" "shaders.tess" "async.tess"
            "storage.tess" "router.tess" "telemetry.tess" "tesseract_ui.tess"
            "main.tess"
          )
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Error: Missing required module $file"
              exit 1
            fi
          done
          echo "All 19 root framework modules verified."

      - name: Compile Tesseract Application
        run: |
          mkdir -p build
          echo "Compiling main.tess entry point..."
          
          # Run actual tess compiler binary toolchain
          tess build main.tess --config tess_config.yaml -o build/tesseract_app
          
          # Verify binary output size (Must be > 1MB)
          FILE_SIZE=$(stat -c%s "build/tesseract_app" 2>/devnull || echo 0)
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "❌ CRITICAL ERROR: Compiler generated invalid or tiny output ($FILE_SIZE bytes)."
            exit 1
          fi
          
          chmod +x build/tesseract_app
          echo "Compilation complete."

      - name: Upload Compiled Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-engine-build
          path: build/tesseract_app
          retention-days: 7
