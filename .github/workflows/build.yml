name: Tesseract Engine Compiler & Shared Object Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-shared-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install LLVM, Clang, and Toolchain Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm

      - name: Compile Tesseract Compiler Executable
        run: |
          g++ -std=c++20 -O3 tess_compiler.cpp -o tesseract_compiler

      - name: Run Tesseract Compiler (Process Source Directories)
        run: |
          # Point the compiler to the folders containing your custom engine files
          ./tesseract_compiler src/ app/ library/

      - name: Build Shared Object Library (libTessSDK.so)
        run: |
          # Compiles the thread-safe JNI bridge with your LLVM intermediate representation core
          clang++ -shared -fPIC -O3 -pthread \
            -I./ \
            TessBridge.c tesseract_master.ll \
            -landroid -llog \
            -o libTessSDK.so

      - name: Verify Exported Library Symbols
        run: |
          file libTessSDK.so
          echo "--- Exported Defined Symbols ---"
          nm -D --defined-only libTessSDK.so

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-engine-binaries
          path: |
            libTessSDK.so
            tess_core.h
            tesseract_master.ll
