name: Build Holomatics SDK AAR

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release Library AAR
        run: ./gradlew :library:assembleRelease -PminifyEnabled=true --configuration-cache --warning-mode all

      - name: Upload Native Release AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: holomatics-sdk-release
          path: library/build/outputs/aar/library-release.aar
          if-no-files-found: error
