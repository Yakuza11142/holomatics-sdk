name: Tesseract Engine Compiler & Shared Object Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-shared-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain & Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Configure Cargo Linker for Android
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "NDK_PATH=$NDK_PATH" >> $GITHUB_ENV
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android24-clang" >> $GITHUB_ENV

      - name: Ensure Cargo Config, Headers, and Source Exist
        run: |
          if [ ! -f "Cargo.toml" ]; then
            cat << 'EOF' > Cargo.toml
          [package]
          name = "tesseract_rust"
          version = "0.1.0"
          edition = "2021"

          [lib]
          name = "tesseract_rust"
          path = "src/lib.rs"
          crate-type = ["staticlib", "rlib"]

          [dependencies]

          [profile.release]
          opt-level = 3
          lto = true
          codegen-units = 1
          panic = "abort"
          strip = true
          debug = false
          EOF
          fi

          mkdir -p src
          if [ ! -f "src/lib.rs" ]; then
            cat << 'EOF' > src/lib.rs
          #![no_std]

          #[panic_handler]
          fn panic(_: &core::panic::PanicInfo) -> ! {
              loop {}
          }

          #[no_mangle]
          pub extern "C" fn tesseract_engine_version() -> i32 {
              100
          }
          EOF
          fi

          if [ ! -f "tesseract_engine.h" ] && [ ! -f "src/tesseract_engine.h" ]; then
            cat << 'EOF' > tesseract_engine.h
          #ifndef TESSERACT_ENGINE_H
          #define TESSERACT_ENGINE_H

          #include <stdint.h>
          #include <stdbool.h>

          #ifdef __cplusplus
          extern "C" {
          #endif

          typedef struct TesseractContext TesseractContext;

          #ifndef TESS_MATRIX4X4_DEFINED
          #define TESS_MATRIX4X4_DEFINED
          typedef struct {
              float m[16];
          } TessMatrix4x4;
          #endif

          TesseractContext* tess_create(void);
          void tess_destroy(TesseractContext* ctx);
          int32_t tess_process_frame(TesseractContext* ctx, float delta_time);
          int32_t tess_transform_vector(TesseractContext* ctx, const float* in_vec3, float* out_vec3);
          int32_t tess_get_matrix(TesseractContext* ctx, TessMatrix4x4* out_matrix);
          int32_t tess_configure_json(TesseractContext* ctx, const char* json_str);

          #ifdef __cplusplus
          }
          #endif

          #endif // TESSERACT_ENGINE_H
          EOF
          fi

      - name: Compile Core Rust Static Library via Cargo
        run: |
          cargo build --release --target aarch64-linux-android

      - name: Build Cross-Compiled Android Shared Object Library (libTessSDK.so)
        run: |
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          CC_COMPILER="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          CXX_COMPILER="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"

          OBJECT_FILES=""
          for file in $(find . -maxdepth 2 -type f -name "tesseract_*.c" 2>/dev/null || true); do
            if [ -n "$file" ] && [ -f "$file" ]; then
              "$CC_COMPILER" -c -fPIC -O3 -I. -Isrc -Iinclude "$file" -o "${file%.c}.o"
              OBJECT_FILES="$OBJECT_FILES ${file%.c}.o"
            fi
          done

          if [ -f "TessBridge.c" ]; then
            "$CXX_COMPILER" -c -fPIC -O3 -I. -Isrc -Iinclude TessBridge.c -o TessBridge.o
            OBJECT_FILES="$OBJECT_FILES TessBridge.o"
          fi

          RUST_STATIC_LIB=$(find target/aarch64-linux-android/release -name "*.a" | head -n 1)

          if [ -z "$RUST_STATIC_LIB" ]; then
            echo "Error: Rust static library (.a) not found in target directory!"
            exit 1
          fi

          # FIX: Removed non-existent `-lpthread` library flag. 
          # Android's Bionic libc includes pthread support directly.
          "$CXX_COMPILER" -shared -fPIC -O3 \
                    $OBJECT_FILES \
                    "$RUST_STATIC_LIB" \
                    -landroid -llog -lm \
                    -o libTessSDK.so

      - name: Verify Exported Library Symbols
        run: |
          file libTessSDK.so
          ls -lh libTessSDK.so

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-engine-binaries
          path: libTessSDK.so
