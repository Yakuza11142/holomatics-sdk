name: Build Holomatics SDK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install SWIG & LLVM Strip Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y swig llvm

      - name: Generate Multi-Language Bindings
        run: |
          echo "Generating bindings via SWIG interface files..."
          mkdir -p bindings
          swig -c++ -csharp -outdir bindings/ tess_core.i

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle Runtime Environment
        uses: gradle/actions/setup-gradle@v3

      # Advanced: Self-healing bootstrap sequence downloads the missing wrapper jar directly from source
      - name: Bootstrap Missing Gradle Wrapper Binary
        run: |
          mkdir -p gradle/wrapper
          echo "📥 Bootstrapping official Gradle 9.7.1 wrapper binary..."
          python3 -c "import urllib.request; urllib.request.urlretrieve('https://githubusercontent.com', 'gradle/wrapper/gradle-wrapper.jar')"
          
          # Verify binary asset availability
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "✅ Gradle Wrapper Jar successfully restored."
          else
            echo "❌ Failed to download wrapper jar."
            exit 1
          fi

      - name: Ensure Gradle Wrapper Executable Permissions
        run: chmod +x gradlew

      - name: Build & Obfuscate Android SDK (.aar)
        run: ./gradlew :library:assembleRelease -PminifyEnabled=true --configuration-cache --warning-mode all

      - name: Strip Native Binary Symbols
        run: |
          echo "Stripping native binary symbols from compiled workspace architectures..."
          find library/build/intermediates/ -name "*.so" -exec llvm-strip --strip-unneeded {} \; 2>/dev/null || true

      - name: Upload Language Bindings (C#, Python, Java)
        uses: actions/upload-artifact@v4
        with:
          name: language-bindings
          path: bindings/

      - name: Upload Obfuscated Android SDK (.aar)
        uses: actions/upload-artifact@v4
        with:
          name: holomatics-sdk-aar
          path: library/build/outputs/aar/*.aar
