name: Tesseract Engine Compiler & Shared Object Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-shared-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain & Android Target
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android
          rustc --version
          cargo --version

      - name: Set up Android NDK & Build Tools
        run: |
          # Ensure ANDROID_HOME is set
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm curl unzip
          
          # Find or install Android NDK
          NDK_PATH=$(find "${ANDROID_HOME}/ndk" -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            echo "Android NDK not found. Installing via sdkmanager..."
            export PATH="$PATH:${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/tools/bin"
            yes | sdkmanager --licenses || true
            sdkmanager "ndk;26.1.10909125" || true
            NDK_PATH=$(find "${ANDROID_HOME}/ndk" -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          fi
          
          if [ -z "$NDK_PATH" ]; then
            echo "Error: Failed to locate or install Android NDK."
            exit 1
          fi

          echo "NDK_PATH=$NDK_PATH" >> $GITHUB_ENV
          
          # Configure Cargo linker for Android cross-compilation
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android24-clang" >> $GITHUB_ENV

      - name: Ensure Cargo Config and Source Exist
        run: |
          if [ ! -f "Cargo.toml" ]; then
            cargo init --lib --name tesseract_rust
            echo -e '\n[lib]\ncrate-type = ["staticlib"]' >> Cargo.toml
          fi
          mkdir -p src
          if [ ! -f "src/lib.rs" ] && [ ! -f "src/main.rs" ]; then
            echo '#![no_std]' > src/lib.rs
            echo '#![no_main]' >> src/lib.rs
            echo '#[panic_handler] fn panic(_: &core::panic::PanicInfo) -> ! { loop {} }' >> src/lib.rs
          fi

      - name: Compile Core Rust Static Library via Cargo
        run: |
          cargo build --release --target aarch64-linux-android

      - name: Build Cross-Compiled Android Shared Object Library (libTessSDK.so)
        run: |
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          CC_COMPILER="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          CXX_COMPILER="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"

          OBJECT_FILES=""
          for file in $(find . -maxdepth 2 -type f -name "tesseract_*.c" 2>/dev/null || true); do
            if [ -n "$file" ]; then
              "$CC_COMPILER" -c -fPIC -O3 -I. "$file" -o "${file%.c}.o"
              OBJECT_FILES="$OBJECT_FILES ${file%.c}.o"
            fi
          done

          if [ -f "TessBridge.c" ]; then
            "$CXX_COMPILER" -c -fPIC -O3 -I. TessBridge.c -o TessBridge.o
            OBJECT_FILES="$OBJECT_FILES TessBridge.o"
          fi

          RUST_STATIC_LIB=$(find target/aarch64-linux-android/release -name "*.a" | head -n 1)
          
          if [ -z "$RUST_STATIC_LIB" ]; then
            echo "Error: Rust static library (.a) not found in target directory!"
            exit 1
          fi

          "$CXX_COMPILER" -shared -fPIC -O3 \
                    $OBJECT_FILES \
                    "$RUST_STATIC_LIB" \
                    -landroid -llog -lm -lpthread \
                    -o libTessSDK.so

      - name: Verify Exported Library Symbols
        run: |
          file libTessSDK.so
          ls -lh libTessSDK.so

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-engine-binaries
          path: libTessSDK.so
