name: Build Holomatics SDK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install SWIG & LLVM Strip Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y swig llvm

      - name: Generate Multi-Language Bindings
        run: |
          echo "Generating bindings via SWIG interface files..."
          mkdir -p bindings
          swig -c++ -csharp -outdir bindings/ tess_core.i

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Runtime Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10'

      - name: Generate Missing Wrapper Jar & Set Permissions
        run: |
          gradle wrapper --gradle-version 8.10
          chmod +x gradlew

      - name: Build & Obfuscate Android SDK (.aar)
        run: ./gradlew :library:assembleRelease -PminifyEnabled=true --no-daemon

      - name: Strip Native Binary Symbols
        run: |
          echo "Stripping native binary symbols from compiled workspace architectures..."
          find library/build/intermediates/ -name "*.so" -exec llvm-strip --strip-unneeded {} \; 2>/dev/null || true

      - name: Verify Generated Outputs
        run: |
          echo "Verifying generated AAR files in workspace..."
          find library/build/outputs/aar/ -type f || echo "Warning: No AAR file produced!"

      - name: Upload Language Bindings (C#, Python, Java)
        uses: actions/upload-artifact@v4
        with:
          name: language-bindings
          path: bindings/

      - name: Upload Obfuscated Android SDK (.aar)
        uses: actions/upload-artifact@v4
        with:
          name: holomatics-sdk-aar
          path: library/build/outputs/aar/**/*.aar
          if-no-files-found: error
