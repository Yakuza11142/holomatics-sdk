name: Build and Release Velo Compiler

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build Velo Compiler (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Compiler Dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc

    - name: Compile Velo Toolchain
      shell: bash
      run: |
        if [ "${{ runner.os }}" == "Windows" ]; then
          gcc -O3 -std=c11 main.c velo.c -o veloc.exe
        else
          gcc -O3 -std=c11 main.c velo.c -o veloc
        fi

    - name: Create Test Source File
      shell: bash
      run: |
        printf 'fn main() {\n    let width: u32 = 1920;\n    var height: u32 = 1080;\n}\n' > engine.vlo

    - name: Test Velo Compilation
      shell: bash
      run: |
        if [ "${{ runner.os }}" == "Windows" ]; then
          ./veloc.exe engine.vlo -o output
          gcc build_out.c -o engine_binary.exe
          ./engine_binary.exe
        else
          ./veloc engine.vlo -o output
          gcc build_out.c -o engine_binary
          ./engine_binary
        fi

    - name: Upload Binary Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: veloc-${{ matrix.os }}
        path: |
          veloc
          veloc.exe
        if-no-files-found: ignore
