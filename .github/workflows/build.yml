name: Tesseract Engine Compiler & Shared Object Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-shared-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      # 🔍 DIAGNOSTIC: Prints your live repository workspace layout for reference mapping
      - name: Verify Live Source Code File Locations
        run: |
          echo "=== ROOT DIRECTORY TREES ==="
          ls -R
          echo "============================"

      - name: Install LLVM, Clang, and Toolchain Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm

      - name: Compile Tesseract Compiler Executable
        run: |
          g++ -std=c++20 -O3 tess_compiler.cpp -o tesseract_compiler

      - name: Run Tesseract Compiler (Dynamically Map All Project Files)
        run: |
          # 🛠️ DYNAMIC SOURCE DISCOVERY:
          # Automatically sweeps app/, src/, and library/ folders to grab every engine source module
          TARGET_FILES=$(find app/ src/ library/ -type f \( -name "*.rs" -o -name "*.cpp" -o -name "*.c" -o -name "*.tess" \))
          
          echo "🚀 Feeding the following tracked files into your custom compiler:"
          echo "$TARGET_FILES"
          
          # Execute your custom compiler engine with all collected target source components passed at once
          ./tesseract_compiler $TARGET_FILES

      - name: Build Cross-Compiled Android Shared Object Library (libTessSDK.so)
        run: |
          # 1. Locate the pre-installed Android NDK on the runner image
          NDK_PATH="${ANDROID_NDK_LATEST_HOME}"
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH="${ANDROID_HOME}/ndk-bundle"
          fi
          
          echo "🤖 Utilizing Android NDK located at: $NDK_PATH"
          
          # 2. Select the cross-compiler toolchain for ARM64 Android devices
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          CLANG_CC="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"
          
          # 3. Securely cross-compile your thread-safe JNI layer alongside your compiler's core engine output
          $CLANG_CC -shared -fPIC -O3 -pthread \
            -I./ \
            TessBridge.c tesseract_master.ll \
            -landroid -llog \
            -o libTessSDK.so

      - name: Verify Exported Library Symbols
        run: |
          file libTessSDK.so
          echo "--- Exported Defined Symbols ---"
          # Using LLVM-NM to verify your core logic methods are cleanly exposed
          llvm-nm -D --defined-only libTessSDK.so

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-engine-binaries
          path: |
            libTessSDK.so
            tess_core.h
            tesseract_master.ll
