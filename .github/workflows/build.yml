Name: Tesseract Engine CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Compile & Package Tesseract Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang curl git

      - name: Install Tess Compiler Toolchain
        run: |
          echo "Setting up tess compiler..."
          # OPTION 1: Download pre-built tess binary from releases/storage (Uncomment & set your URL)
          # curl -L -o /usr/local/bin/tess https://github.com/YOUR_USER/YOUR_COMPILER_REPO/releases/download/v1.0.0/tess
          # chmod +x /usr/local/bin/tess

          # OPTION 2: If compiler source code exists inside this repo (e.g. in compiler/ directory)
          if [ -d "compiler" ]; then
            clang++ -O3 compiler/*.cpp -o /usr/local/bin/tess
            chmod +x /usr/local/bin/tess
          fi

          # Verify compiler binary is in PATH
          if ! command -v tess &> /devnull; then
            echo "CRITICAL ERROR: 'tess' compiler binary not found in system PATH."
            exit 1
          fi
          tess --version || true

      - name: Validate Root .tess Architecture
        run: |
          echo "Checking required root module files..."
          files=(
            "core.tess" "layout.tess" "state.tess"
            "text.tess" "input.tess" "physics.tess" "assets.tess"
            "audio.tess" "particles.tess" "network.tess"
            "animation.tess" "camera.tess" "shaders.tess" "async.tess"
            "storage.tess" "router.tess" "telemetry.tess" "tesseract_ui.tess"
            "main.tess"
          )
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Error: Missing required module $file"
              exit 1
            fi
          done
          echo "All 19 root framework modules verified."

      - name: Compile Tesseract Application
        run: |
          mkdir -p build
          echo "Compiling main.tess entry point..."
          
          # Execute native tess compiler
          tess build main.tess --config tess_config.yaml -o build/tesseract_app
          
          # Verify output size to prevent uploading empty 50-byte text error files
          FILE_SIZE=$(stat -c%s "build/tesseract_app" 2>/devnull || echo 0)
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "❌ CRITICAL ERROR: Compiler output is invalid or corrupted ($FILE_SIZE bytes)."
            cat build/tesseract_app 2>/devnull || true
            exit 1
          fi
          
          chmod +x build/tesseract_app
          echo "Compilation complete. Output size: $FILE_SIZE bytes."

      - name: Upload Compiled Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-engine-build
          path: build/tesseract_app
          retention-days: 7
