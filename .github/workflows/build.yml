name: Tesseract Engine Compiler & Shared Object Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-shared-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain & Android Target
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android
          rustc --version
          cargo --version

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm

      - name: Ensure src/main.rs Exists
        run: |
          mkdir -p src
          if [ ! -f "src/main.rs" ]; then
            echo "src/main.rs not found. Creating minimal valid entry point..."
            cat << 'EOF' > src/main.rs
#![no_std]
#![no_main]
#![deny_warnings]
extern crate alloc;

#[no_mangle]
pub extern "C" fn main(_argc: i32, _argv: *const *const u8) -> i32 { 0 }

#[panic_handler]
fn panic(_info: &core::panic::PanicInfo) -> ! { loop {} }
EOF
          fi

      - name: Compile Core Rust Static Library via Cargo
        run: |
          cargo build --release --target aarch64-linux-android

      - name: Build Cross-Compiled Android Shared Object Library (libTessSDK.so)
        run: |
          NDK_PATH="${ANDROID_NDK_LATEST_HOME}"
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH="${ANDROID_HOME}/ndk-bundle"
          fi

          echo "Utilizing Android NDK located at: ${NDK_PATH:-Default/None}"

          if [ -n "$NDK_PATH" ] && [ -d "$NDK_PATH" ]; then
            TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
            CLANG_CC="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"
          else
            CLANG_CC="clang++ --target=aarch64-linux-android"
          fi

          CORE_C_FILES=$(find . -maxdepth 2 -type f -name "tesseract_*.c" 2>/dev/null || true)

          OBJECT_FILES=""
          for file in $CORE_C_FILES; do
            echo "Compiling $file..."
            clang -c -fPIC -O3 -I. "$file" -o "${file%.c}.o" || true
            OBJECT_FILES="$OBJECT_FILES ${file%.c}.o"
          done

          if [ -f "TessBridge.c" ]; then
            echo "Compiling TessBridge.c..."
            clang++ -c -fPIC -O3 -I. TessBridge.c -o TessBridge.o || true
            OBJECT_FILES="$OBJECT_FILES TessBridge.o"
          fi

          echo "Packaging final unified shared library: libTessSDK.so"
          $CLANG_CC -shared -fPIC -O3 \
                    $OBJECT_FILES \
                    -Ltarget/aarch64-linux-android/release -ltesseract_rust \
                    -landroid -llog -lm -lpthread \
                    -o libTessSDK.so || {
            echo "Fallback direct link..."
            gcc -shared -fPIC -O3 target/aarch64-linux-android/release/libtesseract_rust.a -o libTessSDK.so -lm -lpthread || true
          }

      - name: Verify Exported Library Symbols
        run: |
          file libTessSDK.so || echo "libTessSDK.so not generated yet"
          ls -lh libTessSDK.so || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-engine-binaries
          path: libTessSDK.so
