name: Tesseract Engine Compiler & Shared Object Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-shared-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install Android NDK & Rust Toolchain Targets
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm
          rustup target add aarch64-linux-android

      - name: Compile Core Rust Spatial Module (tesseract_ui.rs)
        run: |
          # Compile your pure Rust module directly into a high-performance static library object
          rustc --target aarch64-linux-android -O --crate-type=staticlib tesseract_ui.rs -o libtesseract_ui.a

      - name: Build Cross-Compiled Android Shared Object Library (libTessSDK.so)
        run: |
          # 1. Locate the pre-installed Android NDK on the runner image
          NDK_PATH="${ANDROID_NDK_LATEST_HOME}"
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH="${ANDROID_HOME}/ndk-bundle"
          fi
          
          echo "🤖 Utilizing Android NDK located at: $NDK_PATH"
          
          # 2. Select the cross-compiler toolchain parameters for ARM64 Android devices
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          CLANG_C="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          CLANG_CC="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"
          
          # 3. Restrict inclusion lookups to root and src structures
          INCLUDE_FLAGS="-I. -I./src"
          
          # 4. Gather all loose native C engine core source modules from the root/src space
          CORE_C_FILES=$(find . -maxdepth 2 -type f -name "tesseract_*.c" ! -name "TessBridge.c")
          
          echo "🔨 Compiling loose C engine components into mobile object modules..."
          # FIX: Explicitly removed the -DTessMatrix4x4 macro flag to eliminate the renaming loop entirely
          for file in $CORE_C_FILES; do
             if [[ "$file" == *"tesseract_concurrency.c"* ]]; then
                 echo "🔗 Injecting master engine context definitions into: $file"
                 $CLANG_C -c -fPIC -O3 -pthread $INCLUDE_FLAGS -include tesseract_engine.h -Wno-macro-redefined -Wno-error=incompatible-pointer-types "$file" -o "${file%.c}.o"
             else
                 # All other modules compile natively using their own tracking headers cleanly
                 $CLANG_C -c -fPIC -O3 -pthread $INCLUDE_FLAGS -Wno-macro-redefined -Wno-error=incompatible-pointer-types "$file" -o "${file%.c}.o"
             fi
          done
          
          # 5. Compile the JNI bridge file as pure C++ to link accurately with NDK system structures
          echo "🔨 Compiling thread-safe JNI interface layer..."
          $CLANG_CC -c -fPIC -O3 -pthread $INCLUDE_FLAGS TessBridge.c -o TessBridge.o
          
          # 6. Gather all newly generated ARM64 native object files
          OBJECT_FILES=$(find . -maxdepth 2 -type f -name "*.o")
          
          echo "🔨 Packaging final unified shared library: libTessSDK.so"
          # Link all mobile object modules and your Rust static library into your final framework package
          $CLANG_CC -shared -fPIC -O3 -pthread \
            $OBJECT_FILES -L. -ltesseract_ui \
            -landroid -llog \
            -o libTessSDK.so

      - name: Verify Exported Library Symbols
        run: |
          file libTessSDK.so
          echo "--- Exported Defined Symbols ---"
          llvm-nm -D --defined-only libTessSDK.so

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-engine-binaries
          path: |
            libTessSDK.so
