name: Tesseract Engine Compiler & Shared Object Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-shared-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install LLVM, Clang, and Toolchain Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm

      - name: Compile Tesseract Compiler Executable
        run: |
          g++ -std=c++20 -O3 tesseract_compiler.cpp -o tesseract_compiler

      - name: Run Tesseract Compiler (Generate LLVM IR & Headers)
        run: |
          ./tesseract_compiler .

      - name: Build Shared Object Library (libtesseract.so)
        run: |
          clang -shared -fPIC tesseract_master.ll -o libtesseract.so

      - name: Verify Exported Library Symbols
        run: |
          file libtesseract.so
          nm -D --defined-only libtesseract.so

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-engine-binaries
          path: |
            libtesseract.so
            tess_core.h
            tesseract_master.ll
