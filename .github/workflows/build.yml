name: Tesseract Engine Compiler & Shared Object Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-shared-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      # 🔍 DIAGNOSTIC: Prints your live repository workspace layout for reference mapping
      - name: Verify Live Source Code File Locations
        run: |
          echo "=== ROOT DIRECTORY TREES ==="
          ls -R
          echo "============================"

      - name: Install LLVM, Clang, and Toolchain Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm

      - name: Compile Tesseract Compiler Executable
        run: |
          g++ -std=c++20 -O3 tess_compiler.cpp -o tesseract_compiler

      - name: Run Tesseract Compiler (Force-Target Android ARM64)
        run: |
          # 1. Locate the pre-installed Android NDK on the runner image
          NDK_PATH="${ANDROID_NDK_LATEST_HOME}"
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH="${ANDROID_HOME}/ndk-bundle"
          fi
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          ANDROID_CLANG="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          
          # 2. Create a temporary local path bin directory
          mkdir -p $HOME/bin
          
          # 3. 🛠️ SYSTEM INTERCEPT PROXY WRAPPERS: Forces host clang calls to compile for mobile hardware targets
          echo -e "#!/bin/bash\n$ANDROID_CLANG -target aarch64-linux-android24 \"\$@\"" > $HOME/bin/clang
          echo -e "#!/bin/bash\n$TOOLCHAIN/bin/aarch64-linux-android24-clang++ -target aarch64-linux-android24 \"\$@\"" > $HOME/bin/clang++
          chmod +x $HOME/bin/clang $HOME/bin/clang++
          export PATH="$HOME/bin:$PATH"
          
          # Verify the path proxy target is active (Should report: Target: aarch64-unknown-linux-android24)
          clang -v
          
          # 4. 🚀 TARGET INITIALIZATION: Pass ONLY your root entry engine file layout.
          # Your custom DependencyResolver will automatically trace and pull in your remaining modules!
          ./tesseract_compiler tesseract_ui.rs --target aarch64-linux-android24 --emit-obj -o tesseract_out

      - name: Build Cross-Compiled Android Shared Object Library (libTessSDK.so)
        run: |
          NDK_PATH="${ANDROID_NDK_LATEST_HOME}"
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH="${ANDROID_HOME}/ndk-bundle"
          fi
          
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          CLANG_CC="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"
          
          # Include flags scan to ensure header cross-linkages match during build phase
          INCLUDE_FLAGS=$(find . -type d ! -path "*/.**" | sed 's/^/-I /' | tr '\n' ' ')
          OBJECT_FILES=$(find . -maxdepth 2 -type f -name "*.o" ! -name "tesseract_compiler")
          
          echo "🔨 Packaging final engine library with targets: $OBJECT_FILES"
          
          # Cross-compile your thread-safe JNI bridge, compiler object output, and loose C cores together
          $CLANG_CC -shared -fPIC -O3 -pthread \
            $INCLUDE_FLAGS \
            TessBridge.c $OBJECT_FILES \
            -landroid -llog \
            -o libTessSDK.so

      - name: Verify Exported Library Symbols
        run: |
          file libTessSDK.so
          echo "--- Exported Defined Symbols ---"
          llvm-nm -D --defined-only libTessSDK.so

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-engine-binaries
          path: |
            libTessSDK.so
            tess_core.h
            tesseract_master.ll
            tesseract_out.o
