name: Tesseract Engine Compiler & Shared Object Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-shared-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain & Android Target
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android
          rustc --version
          cargo --version

      - name: Install System Build Dependencies & Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm curl unzip
          
          # Install Android NDK via sdkmanager if not already present
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" || true

      - name: Ensure Cargo.toml and src/main.rs Exist
        run: |
          if [ ! -f "Cargo.toml" ]; then
            echo "Cargo.toml not found. Initializing library Cargo.toml..."
            cargo init --lib --name tesseract_rust
            # Ensure staticlib crate-type is set
            echo '[lib]' >> Cargo.toml
            echo 'crate-type = ["staticlib"]' >> Cargo.toml
          fi

          mkdir -p src
          if [ ! -f "src/lib.rs" ] && [ ! -f "src/main.rs" ]; then
            echo "Rust source not found. Creating minimal valid entry point..."
            cat << 'EOF' > src/lib.rs
#![no_std]
#![no_main]
#![deny_warnings]
extern crate alloc;

#[panic_handler]
fn panic(_info: &core::panic::PanicInfo) -> ! { loop {} }
EOF
          fi

      - name: Compile Core Rust Static Library via Cargo
        run: |
          cargo build --release --target aarch64-linux-android

      - name: Build Cross-Aligned Android Shared Object Library (libTessSDK.so)
        run: |
          # Locate NDK Path dynamically
          NDK_PATH=$(find ${ANDROID_HOME}/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH="${ANDROID_NDK_LATEST_HOME:-${ANDROID_HOME}/ndk-bundle}"
          fi

          echo "Utilizing Android NDK located at: ${NDK_PATH}"

          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          CC_COMPILER="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          CXX_COMPILER="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"

          if [ ! -f "$CXX_COMPILER" ]; then
            echo "Error: Android NDK Clang compiler not found at $CXX_COMPILER"
            exit 1
          fi

          CORE_C_FILES=$(find . -maxdepth 2 -type f -name "tesseract_*.c" 2>/dev/null || true)

          OBJECT_FILES=""
          for file in $CORE_C_FILES; do
            echo "Cross-compiling C file: $file..."
            "$CC_COMPILER" -c -fPIC -O3 -I. "$file" -o "${file%.c}.o"
            OBJECT_FILES="$OBJECT_FILES ${file%.c}.o"
          done

          if [ -f "TessBridge.c" ]; then
            echo "Cross-compiling TessBridge.c..."
            "$CXX_COMPILER" -c -fPIC -O3 -I. TessBridge.c -o TessBridge.o
            OBJECT_FILES="$OBJECT_FILES TessBridge.o"
          fi

          # Find the compiled Rust static library (.a)
          RUST_STATIC_LIB=$(find target/aarch64-linux-android/release -name "*.a" | head -n 1)
          if [ -z "$RUST_STATIC_LIB" ]; then
            echo "Error: Rust static library not found in target/aarch64-linux-android/release/"
            exit 1
          fi

          echo "Packaging final unified shared library: libTessSDK.so"
          "$CXX_COMPILER" -shared -fPIC -O3 \
                    $OBJECT_FILES \
                    "$RUST_STATIC_LIB" \
                    -landroid -llog -lm -lpthread \
                    -o libTessSDK.so

      - name: Verify Exported Library Symbols
        run: |
          file libTessSDK.so
          ls -lh libTessSDK.so

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-engine-binaries
          path: libTessSDK.so
