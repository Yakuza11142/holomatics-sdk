name: Tesseract Engine Compiler & Shared Object Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-shared-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install Android NDK & Rust Toolchain Targets
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm
          # Install the official cross-compilation compiler target for Android ARM64 hardware
          rustup target add aarch64-linux-android

      - name: Compile Core Rust Spatial Module (tesseract_ui.rs)
        run: |
          # Compile your pure Rust module directly into a high-performance static archive object
          # Using --crate-type=staticlib forcefully packs all internal calculations into the binary pool
          rustc --target aarch64-linux-android -O --crate-type=staticlib tesseract_ui.rs -o libtesseract_ui.a

      - name: Build Cross-Compiled Android Shared Object Library (libTessSDK.so)
        run: |
          # 1. Locate the pre-installed Android NDK on the runner image
          NDK_PATH="${ANDROID_NDK_LATEST_HOME}"
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH="${ANDROID_HOME}/ndk-bundle"
          fi
          
          echo "🤖 Utilizing Android NDK located at: $NDK_PATH"
          
          # 2. Select the cross-compiler toolchain for ARM64 Android devices
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          CLANG_CC="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"
          
          # 3. Dynamic header map scan to link file namespaces across subfolders
          INCLUDE_FLAGS=$(find . -type d ! -path "*/.**" | sed 's/^/-I /' | tr '\n' ' ')
          
          # 4. Gather all loose native C/C++ engine core source modules
          CORE_C_FILES=$(find . -maxdepth 2 -type f \( -name "tesseract_*.c" -o -name "tesseract_*.cpp" \) ! -name "TessBridge.c")
          
          echo "🔨 Packaging final unified library with Rust core and C/C++ files..."
          
          # Cross-compile everything together directly into your true production asset package
          # Links your thread-safe JNI bridge, loose C/C++ cores, and compiled Rust static library together
          $CLANG_CC -shared -fPIC -O3 -pthread \
            $INCLUDE_FLAGS \
            TessBridge.c $CORE_C_FILES -L. -ltesseract_ui \
            -landroid -llog \
            -o libTessSDK.so

      - name: Verify Exported Library Symbols
        run: |
          file libTessSDK.so
          echo "--- Exported Defined Symbols ---"
          # Using LLVM-NM to verify your C-ABI symbols are cleanly exposed
          llvm-nm -D --defined-only libTessSDK.so

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tesseract-engine-binaries
          path: |
            libTessSDK.so
