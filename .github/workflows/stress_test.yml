name: Tesseract Extreme Stress Test & Benchmark

on:
  workflow_dispatch:

jobs:
  stress-test-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        architecture: [x64, arm64]
        exclude:
          - os: ubuntu-latest
            architecture: arm64 # GitHub hosted runners are primarily x64 for Linux, use self-hosted or cross-compilation for ARM if needed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-action@stable

      - name: Run Infinite Fuzzer & Hardware Adaptive Stress Test
        env:
          RUST_BACKTRACE: 1
        run: |
          echo "=== INITIALIZING TESSERACT HARDWARE STRESS TEST ==="
          echo "Target Architecture: ${{ matrix.architecture }}"
          echo "Operating System: ${{ matrix.os }}"
          
          # Compile and execute the stress test / fuzzer module
          cargo build --release --bin tesseract_infinite_fuzzer || echo "Building fuzzer targets..."
          
          # Execute the stress routine leveraging multi-threaded concurrency queues & NPU bypass paths
          if [ -f "target/release/tesseract_infinite_fuzzer" ]; then
            ./target/release/tesseract_infinite_fuzzer --stress-level=maximum --duration=300
          else
            # Fallback to cargo test execution for the integration modules
            cargo test --release --test tesseract_infinite_fuzzer -- --nocapture
          fi

      - name: Run Memory & Arena Allocation Benchmark
        run: |
          echo "=== RUNNING LOCK-FREE CONCURRENCY & MEMORY BENCHMARKS ==="
          cargo bench --workspace --profile release
