name: Download Tesseract Artifacts

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Tesseract Engine Binaries
        uses: actions/download-artifact@v4
        with:
          name: tesseract-engine-binaries
          path: .
          repository: Yakuza11142/holomatics-sdk
          run-id: 39293357467
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify downloaded files
        run: |
          ls -la
          file libTessSDK.so
