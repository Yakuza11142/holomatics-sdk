plugins {
    id 'com.android.library'
}

android {
    namespace 'com.holomatics.sdk'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34

        ndk {
            // Generates universal native libraries for modern 64-bit phones, 
            // legacy 32-bit targets, and desktop testing emulators.
            abiFilters 'arm64-v8a', 'x86_64', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                // FIX: Added cFlags so pure C mathematical engines are optimized at -O3
                cFlags "-O3"
                cppFlags "-std=c++17 -O3"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            // ProGuard is configured to keep JNI links intact
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    // Single-string notation strictly matching Gradle 9.7+ specifications
    implementation "com.android.tools.lint:lint-gradle:31.2.2"
    implementation "com.android.tools.build:aapt2:8.2.2-10154469:linux"
}
