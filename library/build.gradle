plugins {
    id 'com.android.library'
}

android {
    namespace 'com.holomatics.sdk'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34

        ndk {
            // Compiles universal native binaries for modern 64-bit phones, 
            // legacy 32-bit targets, and desktop testing emulators.
            abiFilters 'arm64-v8a', 'x86_64', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                // Maximum performance optimizations applied across BOTH pure C math files 
                // and C++ pipeline configurations.
                cFlags "-O3"
                cppFlags "-std=c++17 -O3"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            // Enables aggressive Java code shrinking and dead-code stripping 
            // to keep the background wrapper footprint incredibly small.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    // Heavy local tools (lint-gradle and aapt2) have been permanently stripped.
    // Add lightweight, standard runtime dependencies here only if needed.
}
