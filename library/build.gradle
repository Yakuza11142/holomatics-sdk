plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace = 'com.tesseract.ui'
    compileSdk = 34

    defaultConfig {
        minSdk = 21
        targetSdk = 34

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path = "src/main/cpp/CMakeLists.txt"
            version = "3.22.1"
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

// Hardened: Remapped to explicit component.findByName lazy lookups 
// This cleanly bypasses the active Project dependency notation deprecation error
publishing {
    publications {
        release(MavenPublication) {
            from components.findByName('release')
            
            groupId = 'com.github.yourusername'
            artifactId = 'tess-sdk'
            version = '1.0.0'
        }
    }
}
