plugins {
    id 'com.android.library'
}

android {
    // 1. FIXED: Namespace corrected to match native C++ JNI code bindings
    namespace 'com.tesseract.ui'
    compileSdk 34

    defaultConfig {
        // 2. FIXED: Raised to API 29 because the binary requires 'memfd_create'
        minSdk 29
        targetSdk 34

        ndk {
            // 3. FIXED: Added 'x86' to complete universal emulation and device compatibility
            abiFilters 'arm64-v8a', 'x86_64', 'armeabi-v7a', 'x86'
        }

        externalNativeBuild {
            cmake {
                // Maximum performance optimizations applied with Link-Time Optimization (-flto)
                cFlags "-O3 -flto"
                cppFlags "-std=c++17 -O3 -flto"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    // Keep empty as requested; lightweight app architectures will bundle seamlessly here
}
